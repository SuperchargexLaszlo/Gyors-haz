[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/kontenerhoz"
  to = "/kontenerhaz"
  status = 301
  force = true

[[redirects]]
  from = "/kontenerhoz/*"
  to = "/kontenerhaz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

[dev]
  command = "npm run dev"
  port = 4321
